version: '3'

# Global variables available to all tasks
vars:
  CLUSTER_NAME: mlops-lab
  REGION: eu-central-1
  PROFILE: mlops-platform
  DEPLOY_REPO: ../mlops-platform-deploy

# ─────────────────────────────────────────────────────────────
# BRING-UP
# ─────────────────────────────────────────────────────────────

tasks:

  apply:
    desc: "Full cluster bring-up — network → cluster → kubeconfig → patch → platform"
    cmds:
      - task: apply-network
      - task: apply-cluster
      - task: kubeconfig
      - task: patch-karpenter-endpoint
      - task: commit-deploy-repo
      - task: apply-platform
      - task: patch-alertmanager-webhooks

  apply-network:
    desc: "Apply terraform/network"
    dir: terraform/network
    cmds:
      - terraform apply -auto-approve

  apply-cluster:
    desc: "Apply terraform/cluster"
    dir: terraform/cluster
    cmds:
      - terraform apply -auto-approve

  kubeconfig:
    desc: "Update kubeconfig for mlops-lab"
    cmds:
      - aws eks update-kubeconfig
          --name {{.CLUSTER_NAME}}
          --region {{.REGION}}
          --profile {{.PROFILE}}

  patch-karpenter-endpoint:
    desc: "Update clusterEndpoint in deploy repo after cluster recreate"
    cmds:
      - |
        ENDPOINT=$(aws eks describe-cluster \
          --name {{.CLUSTER_NAME}} \
          --region {{.REGION}} \
          --profile {{.PROFILE}} \
          --query 'cluster.endpoint' \
          --output text)
        echo "Patching clusterEndpoint to: $ENDPOINT"
        sed -i '' "s|clusterEndpoint:.*|clusterEndpoint: \"${ENDPOINT}\"|" \
          {{.DEPLOY_REPO}}/apps/karpenter/application.yaml

  patch-alertmanager-webhooks:        # ← ADD HERE, after patch-karpenter-endpoint
    desc: "Patch Slack webhook URLs into Alertmanager config after apply"
    cmds:
      - |
        ALERTS_URL=$(aws secretsmanager get-secret-value \
          --secret-id mlops-platform/alertmanager/slack-webhook-alerts \
          --region {{.REGION}} \
          --profile {{.PROFILE}} \
          --query SecretString \
          --output text)
        CRITICAL_URL=$(aws secretsmanager get-secret-value \
          --secret-id mlops-platform/alertmanager/slack-webhook-critical \
          --region {{.REGION}} \
          --profile {{.PROFILE}} \
          --query SecretString \
          --output text)
        kubectl get secret alertmanager-kube-prometheus-stack-alertmanager \
          -n monitoring -o json \
          | jq --arg alerts "$ALERTS_URL" --arg critical "$CRITICAL_URL" \
            '.data["alertmanager.yaml"] |= (. | @base64d |
              gsub("SLACK_WEBHOOK_ALERTS_PLACEHOLDER"; $alerts) |
              gsub("SLACK_WEBHOOK_CRITICAL_PLACEHOLDER"; $critical) |
              @base64)' \
          | kubectl apply -f -
        kubectl delete pod -n monitoring \
          -l app.kubernetes.io/name=alertmanager
        echo "Alertmanager webhooks patched and pod restarted"

  commit-deploy-repo:
    desc: "Commit and push deploy repo after endpoint patch"
    dir: "{{.DEPLOY_REPO}}"
    cmds:
      - git add apps/karpenter/application.yaml
      - |
        git diff --staged --quiet || git commit -m "chore: update Karpenter clusterEndpoint for new cluster"
      - git push

  apply-platform:
    desc: "Apply terraform/platform"
    dir: terraform/platform
    cmds:
      - terraform apply -auto-approve

# ─────────────────────────────────────────────────────────────
# DESTROY
# ─────────────────────────────────────────────────────────────

  destroy:
    desc: "Full cluster teardown — safe sequence with NodePool deletion first"
    cmds:
      - task: delete-nodepool
      - task: delete-crds
      - task: destroy-platform
      - task: destroy-cluster
      - task: destroy-network
      - task: verify-clean

  delete-nodepool:
    desc: "Delete Karpenter NodePool and wait for all NodeClaims to terminate"
    cmds:
      - echo "Deleting Karpenter NodePool..."
      - kubectl delete nodepool default --ignore-not-found=true
      - echo "Waiting for NodeClaims to drain..."
      - |
        while kubectl get nodeclaim 2>/dev/null | grep -q "default-"; do
          echo "  NodeClaims still present, waiting 10s..."
          sleep 10
        done
      - echo "All NodeClaims terminated. Safe to destroy."

  delete-crds:
    desc: "Delete CRDs with keep policy that block namespace termination"
    cmds:
      - echo "Deleting ArgoCD CRDs..."
      - |
        kubectl delete crd \
          applications.argoproj.io \
          applicationsets.argoproj.io \
          appprojects.argoproj.io \
          --ignore-not-found=true
      - echo "Deleting cert-manager CRDs..."
      - |
        kubectl delete crd \
          certificaterequests.cert-manager.io \
          certificates.cert-manager.io \
          challenges.acme.cert-manager.io \
          clusterissuers.cert-manager.io \
          issuers.cert-manager.io \
          orders.acme.cert-manager.io \
          --ignore-not-found=true
      - echo "Deleting Karpenter CRDs..."
      - |
        kubectl delete crd \
          ec2nodeclasses.karpenter.k8s.aws \
          nodeclaims.karpenter.sh \
          nodepools.karpenter.sh \
          nodeoverlays.karpenter.sh \
          --ignore-not-found=true
      - echo "CRD cleanup complete"

  destroy-platform:
    desc: "Destroy terraform/platform"
    dir: terraform/platform
    cmds:
      - terraform destroy -auto-approve

  destroy-cluster:
    desc: "Destroy terraform/cluster"
    dir: terraform/cluster
    cmds:
      - terraform destroy -auto-approve

  destroy-network:
    desc: "Destroy terraform/network"
    dir: terraform/network
    cmds:
      - terraform destroy -auto-approve

  verify-clean:
    desc: "Confirm no running resources remain"
    cmds:
      - echo "=== EKS Clusters ==="
      - aws eks list-clusters
          --region {{.REGION}}
          --profile {{.PROFILE}}
      - echo "=== NAT Gateways ==="
      - |
        aws ec2 describe-nat-gateways \
          --region {{.REGION}} \
          --profile {{.PROFILE}} \
          --filter "Name=state,Values=available,pending" \
          --query 'NatGateways[].NatGatewayId'

# ─────────────────────────────────────────────────────────────
# UTILITIES
# ─────────────────────────────────────────────────────────────

  sanity:
    desc: "Run full sanity check — commits, cluster state, Karpenter health"
    cmds:
      - echo "=== IaC repo commits ==="
      - git log --oneline -3
      - echo "=== Deploy repo commits ==="
      - git -C {{.DEPLOY_REPO}} log --oneline -3
      - echo "=== Running clusters (must be empty before apply) ==="
      - aws eks list-clusters
          --region {{.REGION}}
          --profile {{.PROFILE}}
      - echo "=== NAT Gateways (must be empty before apply) ==="
      - |
        aws ec2 describe-nat-gateways \
          --region {{.REGION}} \
          --profile {{.PROFILE}} \
          --filter "Name=state,Values=available,pending" \
          --query 'NatGateways[].NatGatewayId'

  karpenter-status:
    desc: "Check Karpenter health — pods, nodeclass, nodepool, nodeclaims"
    cmds:
      - echo "=== Karpenter pods ==="
      - kubectl get pods -n karpenter -o wide
      - echo "=== EC2NodeClass ==="
      - kubectl get ec2nodeclass default
      - echo "=== NodePool ==="
      - kubectl get nodepool default
      - echo "=== NodeClaims ==="
      - kubectl get nodeclaim
      - echo "=== Karpenter logs (errors only) ==="
      - |
        kubectl logs -n karpenter \
          -l app.kubernetes.io/name=karpenter \
          --tail=20 | grep -i "error\|warn" || echo "No errors"

  nodes:
    desc: "Show all nodes with labels and capacity"
    cmds:
      - kubectl get nodes -o wide
      - echo "--- Karpenter nodes ---"
      - kubectl get nodes -l provisioner=karpenter
      - echo "--- Managed nodes ---"
      - kubectl get nodes -l eks.amazonaws.com/nodegroup

  all-pods-healthy:
    desc: "Show any pods not in Running or Completed state"
    cmds:
      - |
        UNHEALTHY=$(kubectl get pods -A | grep -v Running | grep -v Completed | grep -v NAME)
        if [ -z "$UNHEALTHY" ]; then
          echo "All pods healthy"
        else
          echo "$UNHEALTHY"
        fi