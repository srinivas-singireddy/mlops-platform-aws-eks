version: '3'

# Global variables available to all tasks
vars:
  CLUSTER_NAME: mlops-lab
  REGION: eu-central-1
  PROFILE: mlops-platform
  DEPLOY_REPO: ../mlops-platform-deploy

# ─────────────────────────────────────────────────────────────
# BRING-UP
# ─────────────────────────────────────────────────────────────

tasks:

  apply:
    desc: "Full cluster bring-up — network → cluster → kubeconfig → platform"
    cmds:
      - task: apply-network
      - task: apply-cluster
      - task: kubeconfig
      - task: apply-platform
      - task: wait-for-monitoring
      - task: patch-alertmanager-webhooks

  apply-network:
    desc: "Apply terraform/network"
    dir: terraform/network
    cmds:
      - terraform apply -auto-approve

  apply-cluster:
    desc: "Apply terraform/cluster"
    dir: terraform/cluster
    cmds:
      - terraform apply -auto-approve

  kubeconfig:
    desc: "Update kubeconfig for mlops-lab"
    cmds:
      - aws eks update-kubeconfig
          --name {{.CLUSTER_NAME}}
          --region {{.REGION}}
          --profile {{.PROFILE}}

  wait-for-monitoring:
    desc: "Wait for Alertmanager pod to be ready before patching webhooks"
    cmds:
      - echo "Waiting for monitoring namespace..."
      - |
        until kubectl get namespace monitoring 2>/dev/null | grep -q Active; do
          echo "  monitoring namespace not ready, waiting 15s..."
          sleep 15
        done
      - echo "Waiting for Alertmanager secret to exist..."
      - |
        until kubectl get secret alertmanager-kube-prometheus-stack-alertmanager \
          -n monitoring 2>/dev/null; do
          echo "  Alertmanager secret not ready, waiting 15s..."
          sleep 15
        done
      - echo "Waiting for Alertmanager pod to be ready..."
      - |
        until kubectl get pod -n monitoring \
          -l app.kubernetes.io/name=alertmanager \
          2>/dev/null | grep -q Running; do
          echo "  Alertmanager not ready, waiting 15s..."
          sleep 15
        done
      - echo "Alertmanager ready. Proceeding with webhook patch."

  patch-alertmanager-webhooks:
    desc: "Patch Slack webhook URLs into Alertmanager config after apply"
    cmds:
      - |
        ALERTS_URL=$(aws secretsmanager get-secret-value \
          --secret-id mlops-platform/alertmanager/slack-webhook-alerts \
          --region {{.REGION}} \
          --profile {{.PROFILE}} \
          --query SecretString \
          --output text)
        CRITICAL_URL=$(aws secretsmanager get-secret-value \
          --secret-id mlops-platform/alertmanager/slack-webhook-critical \
          --region {{.REGION}} \
          --profile {{.PROFILE}} \
          --query SecretString \
          --output text)
        kubectl get secret alertmanager-kube-prometheus-stack-alertmanager \
          -n monitoring -o json \
          | jq --arg alerts "$ALERTS_URL" --arg critical "$CRITICAL_URL" \
            '.data["alertmanager.yaml"] |= (. | @base64d |
              gsub("https://hooks.slack.com/services/alerts-placeholder"; $alerts) |
              gsub("https://hooks.slack.com/services/critical-placeholder"; $critical) |
              @base64)' \
          | kubectl apply -f -
        kubectl delete pod -n monitoring \
          -l app.kubernetes.io/name=alertmanager
        echo "Alertmanager webhooks patched and pod restarted"

  apply-platform:
    desc: "Apply terraform/platform"
    dir: terraform/platform
    cmds:
      - terraform apply -auto-approve

# ─────────────────────────────────────────────────────────────
# DESTROY
# ─────────────────────────────────────────────────────────────

  destroy:
    desc: "Full cluster teardown — k8s pre-clean → platform → cluster → network → verify"
    cmds:
      - task: k8s-preclean
      - task: destroy-platform
      - task: destroy-cluster
      - task: destroy-network
      - task: verify-clean

  k8s-preclean:
      desc: "Ordered Kubernetes teardown before terraform destroy — idempotent, fails hard"
      cmds:
        # Reachability guard — skip cleanly if cluster is already gone
        - |
          if ! kubectl cluster-info --request-timeout=5s >/dev/null 2>&1; then
            echo "Cluster unreachable — skipping k8s-preclean (already torn down)."
            exit 0
          fi

        # 1. Delete ArgoCD Applications GRACEFULLY so the cascade tears down
        #    the Helm releases (StatefulSets/Deployments). Finalizers intact.
        - echo "→ Deleting ArgoCD Applications (graceful cascade)..."
        - |
          kubectl delete applications -n argocd --all \
            --ignore-not-found=true --timeout=180s || {
            echo "  Graceful delete timed out — force-stripping app finalizers..."
            for app in $(kubectl get applications -n argocd \
              -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
              kubectl patch application "$app" -n argocd --type merge \
                -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
            done
            kubectl delete applications -n argocd --all \
              --ignore-not-found=true --timeout=60s || true
          }

        # 2. Belt-and-braces: delete any workloads the cascade left behind.
        #    Removes DEMAND (Karpenter refill race) and releases EBS volumes.
        #    NOTE: test workloads in other namespaces are deleted manually.
        - echo "→ Deleting remaining workloads in monitoring..."
        - |
          kubectl delete statefulset,deployment,replicaset --all -n monitoring \
            --ignore-not-found=true --timeout=120s || true

        # 3. Wait for pods to ACTUALLY terminate — volumes stay attached until they do
        - echo "→ Waiting for monitoring pods to terminate..."
        - |
          for i in $(seq 1 30); do
            REMAINING=$(kubectl get pods -n monitoring \
              --field-selector=status.phase!=Succeeded \
              -o jsonpath='{.items[*].metadata.name}' 2>/dev/null | wc -w | tr -d ' ')
            if [ "$REMAINING" = "0" ]; then
              echo "  All monitoring pods terminated."
              break
            fi
            echo "  $REMAINING pod(s) still terminating, waiting 10s... ($i/30)"
            sleep 10
            if [ "$i" -eq 30 ]; then
              echo "ERROR: monitoring pods still running after 5 minutes."
              echo "       Volumes cannot detach while pods hold them. Aborting."
              echo "       Diagnose with: kubectl get pods -n monitoring"
              exit 1
            fi
          done

        # 4. Delete PVCs — should release cleanly now that no pod holds them.
        #    Finalizer strip is a FALLBACK, not the first move.
        - echo "→ Deleting PVCs..."
        - |
          kubectl delete pvc -n monitoring --all \
            --ignore-not-found=true --timeout=120s || {
            echo "  PVC delete timed out — force-stripping finalizers..."
            for pvc in $(kubectl get pvc -n monitoring \
              -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
              kubectl patch pvc "$pvc" -n monitoring --type merge \
                -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
            done
            kubectl delete pvc -n monitoring --all \
              --ignore-not-found=true --force --grace-period=0 || true
          }

        # 5. Verify against ground truth: poll AWS until volumes are actually gone.
        - echo "→ Waiting for CSI to delete backing EBS volumes..."
        - |
          for i in $(seq 1 12); do
            VOLS=$(aws ec2 describe-volumes \
              --region {{.REGION}} --profile {{.PROFILE}} \
              --filter "Name=tag:ebs.csi.aws.com/cluster-name,Values={{.CLUSTER_NAME}}" \
              --query 'Volumes[].VolumeId' --output text 2>/dev/null)
            if [ -z "$VOLS" ]; then
              echo "  All cluster EBS volumes deleted."
              break
            fi
            echo "  Volumes still present, waiting 10s... ($i/12)"
            sleep 10
            if [ "$i" -eq 12 ]; then
              echo "ERROR: EBS volumes still present after 2 minutes:"
              echo "       $VOLS"
              echo "       CSI driver has not deleted them. Destroying the cluster now"
              echo "       would orphan these volumes. Aborting."
              exit 1
            fi
          done

        # 6. NOW drain compute — safe, because no pending pods remain to refill
        - echo "→ Deleting Karpenter NodePool and draining NodeClaims..."
        - kubectl delete nodepool default --ignore-not-found=true --timeout=120s || true
        - |
          for i in $(seq 1 30); do
            if ! kubectl get nodeclaim 2>/dev/null | grep -q "default-"; then
              echo "  All NodeClaims drained."
              break
            fi
            echo "  NodeClaims still draining, waiting 10s... ($i/30)"
            sleep 10
            if [ "$i" -eq 30 ]; then
              echo "ERROR: NodeClaims still present after 5 minutes."
              echo "       Karpenter may be re-provisioning for pending pods."
              echo "       Check with: kubectl get nodeclaim; kubectl get pods -A | grep Pending"
              exit 1
            fi
          done

        # 7. Delete Helm-retained CRDs last — nothing depends on them now
        - echo "→ Deleting Helm-retained CRDs..."
        - |
          kubectl delete crd \
            applications.argoproj.io applicationsets.argoproj.io appprojects.argoproj.io \
            certificaterequests.cert-manager.io certificates.cert-manager.io \
            challenges.acme.cert-manager.io clusterissuers.cert-manager.io \
            issuers.cert-manager.io orders.acme.cert-manager.io \
            ec2nodeclasses.karpenter.k8s.aws nodeclaims.karpenter.sh \
            nodepools.karpenter.sh nodeoverlays.karpenter.sh \
            --ignore-not-found=true --timeout=60s || true
        - echo "k8s-preclean complete."


  force-finalize:
    desc: "Break-glass — force-clear finalizers on namespaces stuck Terminating"
    cmds:
      - echo "Scanning for namespaces stuck in Terminating..."
      - |
        for ns in $(kubectl get namespace \
          -o jsonpath='{range .items[?(@.status.phase=="Terminating")]}{.metadata.name}{"\n"}{end}' 2>/dev/null); do
          echo "  Force-finalizing namespace: $ns"
          kubectl get namespace "$ns" -o json \
            | jq '.spec.finalizers = []' \
            | kubectl replace --raw "/api/v1/namespaces/$ns/finalize" -f - 2>/dev/null || true
        done
      - echo "force-finalize complete."

  destroy-platform:
    desc: "Destroy terraform/platform"
    dir: terraform/platform
    cmds:
      - terraform destroy -auto-approve

  destroy-cluster:
    desc: "Destroy terraform/cluster"
    dir: terraform/cluster
    cmds:
      - terraform destroy -auto-approve

  destroy-network:
    desc: "Destroy terraform/network"
    dir: terraform/network
    cmds:
      - terraform destroy -auto-approve

  verify-clean:
    desc: "Confirm no running resources remain — clusters, NAT, orphaned EBS"
    cmds:
      - echo "=== EKS Clusters ==="
      - aws eks list-clusters --region {{.REGION}} --profile {{.PROFILE}} --output text
      - echo "=== NAT Gateways ==="
      - |
        aws ec2 describe-nat-gateways \
          --region {{.REGION}} --profile {{.PROFILE}} \
          --filter "Name=state,Values=available,pending" \
          --query 'NatGateways[].NatGatewayId' --output text
      - echo "=== Orphaned EBS Volumes (cluster {{.CLUSTER_NAME}}) ==="
      - |
        aws ec2 describe-volumes \
          --region {{.REGION}} --profile {{.PROFILE}} \
          --filter "Name=tag:ebs.csi.aws.com/cluster-name,Values={{.CLUSTER_NAME}}" \
                   "Name=status,Values=available,creating" \
          --query 'Volumes[].VolumeId' --output text

# ─────────────────────────────────────────────────────────────
# UTILITIES
# ─────────────────────────────────────────────────────────────

  sanity:
    desc: "Run full sanity check — commits, cluster state, Karpenter health"
    cmds:
      - echo "=== IaC repo commits ==="
      - git log --oneline -3
      - echo "=== Deploy repo commits ==="
      - git -C {{.DEPLOY_REPO}} log --oneline -3
      - echo "=== Running clusters (must be empty before apply) ==="
      - aws eks list-clusters --region {{.REGION}} --profile {{.PROFILE}} --output text
      - echo "=== NAT Gateways (must be empty before apply) ==="
      - |
        aws ec2 describe-nat-gateways \
          --region {{.REGION}} --profile {{.PROFILE}} \
          --filter "Name=state,Values=available,pending" \
          --query 'NatGateways[].NatGatewayId' --output text

  karpenter-status:
    desc: "Check Karpenter health — pods, nodeclass, nodepool, nodeclaims"
    cmds:
      - echo "=== Karpenter pods ==="
      - kubectl get pods -n karpenter -o wide
      - echo "=== EC2NodeClass ==="
      - kubectl get ec2nodeclass default
      - echo "=== NodePool ==="
      - kubectl get nodepool default
      - echo "=== NodeClaims ==="
      - kubectl get nodeclaim
      - echo "=== Karpenter logs (errors only) ==="
      - |
        kubectl logs -n karpenter \
          -l app.kubernetes.io/name=karpenter \
          --tail=20 | grep -i "error\|warn" || echo "No errors"

  nodes:
    desc: "Show all nodes with labels and capacity"
    cmds:
      - kubectl get nodes -o wide
      - echo "--- Karpenter nodes ---"
      - kubectl get nodes -l provisioner=karpenter
      - echo "--- Managed nodes ---"
      - kubectl get nodes -l eks.amazonaws.com/nodegroup

  all-pods-healthy:
    desc: "Show any pods not in Running or Completed state"
    cmds:
      - |
        UNHEALTHY=$(kubectl get pods -A | grep -v Running | grep -v Completed | grep -v NAME)
        if [ -z "$UNHEALTHY" ]; then
          echo "All pods healthy"
        else
          echo "$UNHEALTHY"
        fi